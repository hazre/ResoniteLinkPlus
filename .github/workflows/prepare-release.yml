name: Create Release PR

on:
  push:
    branches: [main]

permissions: {}

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Prepare Release
        id: knope
        shell: bash
        run: |
          version="$(grep -oPm1 '<Version>\K[^<]+' ResoniteLinkPlus/ResoniteLinkPlus.csproj | tr -d '\r\n ')"
          has_tag="$(git tag -l "v$version" | head -1)"

          log_file="$(mktemp)"
          set +e
          if [ -n "$has_tag" ]; then
            knope prepare-release --verbose >"$log_file" 2>&1
          else
            knope prepare-release --verbose --override-version "$version" >"$log_file" 2>&1
          fi
          status=$?
          set -e
          cat "$log_file"

          if [ "$status" -eq 0 ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -qE 'No packages are ready to release|releases::no_release' "$log_file"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      released: ${{ steps.knope.outputs.released }}

  build-preview:
    needs: prepare-release
    if: needs.prepare-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build and create Thunderstore package
        id: build
        run: mise run build

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: './build/*.zip'

      - name: Upload Preview Artifacts
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ResoniteLinkPlus-${{ steps.build.outputs.version }}-preview
          path: ./build/*.zip

      - name: Update PR Body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          current_body=$(gh pr view release --json body -q '.body')
          new_body="$current_body

          ## Preview Build

          [Download ResoniteLinkPlus-${VERSION}-preview]($ARTIFACT_URL)"
          gh pr edit release --body "$new_body"
