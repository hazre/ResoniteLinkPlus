min_version = '2026.7.11'

[settings]
idiomatic_version_file_enable_tools = ["dotnet"]
experimental = true

[hooks]
enter = { task = "restore" }

[tasks.restore]
description = "Restore NuGet packages and dotnet tools"
run = "dotnet restore && dotnet tool restore"

[tasks.build]
description = "Build all plugin DLLs and Thunderstore package via PackTS"
run = "dotnet build ResoniteLinkPlus.slnx -c Release -t:PackTS"

[tasks."actions:audit"]
description = "Audit GitHub Actions for security issues"
run = "zizmor .github/workflows"
tools = { "zizmor" = "latest" }

[tasks."actions:update"]
description = "Update pinned GitHub Actions to latest SHAs"
run = "pinact run -u"
tools = { "pinact" = "latest" }

[tasks.release]
description = "Create a new GitHub release"
depends = ["build"]
run = "knope release --verbose"

[tasks.publish]
description = "Publish to Thunderstore via PackTS"
depends = ["release"]
tools = { fnox = "1.28.0", age = "1.3.1" }
run = "fnox exec -- dotnet build ResoniteLinkPlus.slnx -c Release -t:PackTS -p:PublishTS=true"

[tools]
cargo-binstall = "1.21.1"
"cargo:knope" = "0.23.0"
